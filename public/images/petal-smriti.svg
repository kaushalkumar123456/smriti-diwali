      <path d="M360 295c-14-12-75-58-75-101 0-40 50-54 75-16 25-38 75-24 75 16 0 43-61 89-75 101Z"/>
    </clipPath>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#4a1822" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="720" height="400" fill="#fffdf9"/>
  <rect width="720" height="400" fill="#d2bdac" opacity=".08"/>
  <g filter="url(#shadow)">
    <rect x="14" y="15" width="692" height="370" fill="url(#petals)" clip-path="url(#initials)"/>
    <rect x="14" y="15" width="692" height="370" fill="url(#petals)" clip-path="url(#heart)"/>
  </g>
  <path d="M360 286c-18-15-65-53-65-91 0-27 33-38 65 1 32-39 65-28 65-1 0 38-47 76-65 91Z" fill="none" stroke="#fff0e8" stroke-opacity=".34" stroke-width="2"/>
